[package]
name = "mcpg-markdown-convert"
version = "0.1.0-beta.7"
edition = "2024"
license = "Apache-2.0"
description = """
Document-to-Markdown conversion engine for MCPG. Turns Office files, PDF,
HTML, e-mail, archives, images and audio into LLM-friendly Markdown: a
priority-ordered converter registry, a content/extension/declared-MIME
detection ladder, a small document IR, and a CommonMark+GFM renderer with
optional operator MiniJinja templates.

Pure compute — no filesystem access, no network, no host handle. The
`dev.mcpg.backend.markdown` plugin wraps this crate and owns everything that
touches the outside world, so every converter here is unit-testable without a
gateway.
"""

[features]
default = ["text", "web", "office"]
# Format groups, the build-time analogue of markitdown's optional extras.
# `text` needs nothing beyond the always-on deps.
text = []
web = ["dep:htmd"]
office = ["dep:calamine"]
pdf = ["dep:pdf-extract"]
media = ["dep:kamadak-exif", "dep:lofty"]
email = ["dep:cfb"]
all = ["text", "web", "office", "pdf", "media", "email"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Zip container: DOCX / PPTX / XLSX / EPUB / .zip all ride on it. No bzip2 or
# zstd features — they pull C code and this crate must cross-compile to musl
# and windows-gnu unaided.
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.39"
csv = "1"
minijinja = "2"
mime_guess = "2"
# Magic-byte sniffing. Our stand-in for markitdown's Magika: no model to ship,
# and the answer is reproducible across versions.
infer = "0.22"
chardetng = "0.1"
encoding_rs = "0.8"
base64 = "0.22"
blake3 = "1"
# turndown.js-inspired HTML → Markdown, with a faithful mode that keeps HTML
# for constructs Markdown cannot express (Apache-2.0).
htmd = { version = "0.5", optional = true }
# Spreadsheets, including legacy .xls — covers markitdown's [xlsx] and [xls]
# extras with one pure-Rust dep (MIT).
calamine = { version = "0.36", optional = true }
# Text extraction only — no layout, no tables, no OCR (see the converter's
# module docs). `lopdf` rides in through its re-export rather than as a second
# direct dependency, so the two can never disagree on a version.
pdf-extract = { version = "0.12", optional = true }
kamadak-exif = { version = "0.6", optional = true }
lofty = { version = "0.25", optional = true }
# OLE compound-file container — the .msg envelope markitdown reads with
# olefile. The MAPI property decoding on top is ours.
cfb = { version = "0.14", optional = true }

[dev-dependencies]
serde_json = "1"
